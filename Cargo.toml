[package]
name = "apus"
version = "0.1.0"
edition = "2021"
description = "Run Rust futures as Swift Concurrency Tasks (or on libdispatch) on Apple platforms"
license = "MIT OR Apache-2.0"
publish = false

[features]
default = ["swift"]
swift = ["dep:apus-sys", "dep:apus-macros"]
# Raises the deployment floor to macOS 15 (see sys/README.md).
macos15 = ["swift", "apus-sys/macos15"]
# Compiles the C side as LLVM bitcode for cross-language LTO with Rust (README: Cross-language LTO).
xlto = ["swift", "apus-sys/xlto"]
dispatch = ["dep:async-task", "dep:dispatch2"]
# objc2 objects (`Retained<T>`) as Swift class references: arguments, results, receivers, conversions.
objc2 = ["swift", "dep:objc2"]
# block2 blocks (`&Block<F>`, `RcBlock<F>`) as Swift `@convention(block)` functions.
block2 = ["objc2", "dep:block2"]
test-probe = ["swift"]
# `impl futures_core::Stream for SwiftStream`
stream = ["swift", "dep:futures-core"]

[dependencies]
async-task = { version = "4", optional = true }
futures-core = { version = "0.3", optional = true, default-features = false }
apus-macros = { path = "macros", optional = true }
apus-sys = { path = "sys", version = "=0.1.0", optional = true }
dispatch2 = { version = "0.3.1", default-features = false, features = ["std"], optional = true }
objc2 = { version = "0.6", optional = true }
block2 = { version = "0.6", optional = true }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFRunLoop", "CFString", "CFDate"] }
libc = "0.2"

[dev-dependencies]
libtest-mimic = "0.8"
apus-sys = { path = "sys" }

[[test]]
name = "dispatch"
harness = false
required-features = ["dispatch"]

