[package]
name = "apus"
version = "0.1.0"
edition = "2021"
description = "Run Rust futures as Swift Concurrency Tasks (or on libdispatch) on Apple platforms"
license = "MIT OR Apache-2.0"
publish = false

[features]
default = ["swift"]
swift = ["dep:apus-sys"]
# Raises the deployment floor to macOS 15 (see sys/README.md).
macos15 = ["swift", "apus-sys/macos15"]
dispatch = []
test-probe = ["swift"]
# `impl futures_core::Stream for SwiftStream`
stream = ["swift", "dep:futures-core"]

[dependencies]
async-task = "4"
futures-core = { version = "0.3", optional = true, default-features = false }
apus-macros = { path = "macros" }
apus-sys = { path = "sys", version = "=0.1.0", optional = true }
dispatch2 = { version = "0.3.1", default-features = false, features = ["std"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFRunLoop", "CFString", "CFDate"] }
libc = "0.2"

[dev-dependencies]
libtest-mimic = "0.8"
apus-sys = { path = "sys" }

[[test]]
name = "dispatch"
harness = false
required-features = ["dispatch"]

[[test]]
name = "dispatch_main_deadlock"
harness = false
required-features = ["dispatch"]

[[test]]
name = "dispatch_run_main"
harness = false
required-features = ["dispatch"]

[[test]]
name = "swift_task"
harness = false
required-features = ["test-probe"]

[[test]]
name = "swift_run_main"
harness = false
required-features = ["test-probe"]

[[test]]
name = "swift_any"
harness = false
required-features = ["test-probe"]

[[test]]
name = "swift_call"
harness = false
required-features = ["test-probe"]

[[example]]
name = "dispatch_basic"
required-features = ["dispatch"]

[[example]]
name = "swift_basic"
required-features = ["swift"]

[[test]]
name = "swift_main_children"
harness = false
required-features = ["test-probe"]

[[test]]
name = "swift_selfcheck_in_task"
harness = false
required-features = ["test-probe"]

[[test]]
name = "swift_fn"
harness = false
required-features = ["test-probe"]

[[test]]
name = "swift_generic"
harness = false
required-features = ["test-probe"]

[[test]]
name = "swift_macro"
harness = false
required-features = ["test-probe"]

[[test]]
name = "swift_stream"
harness = false
required-features = ["test-probe"]

[workspace]
members = [".", "sys", "mangle", "macros"]
