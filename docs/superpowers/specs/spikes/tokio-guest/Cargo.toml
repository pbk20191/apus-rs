[package]
name = "tokio-guest"
version = "0.0.0"
edition = "2021"
[dependencies]
tokio = { version = "1", features = ["rt", "time", "sync", "macros"] }
async-swift-rs = { path = "../../../../..", default-features = false, features = ["dispatch"] }
objc2-core-foundation = { version = "0.3.2", features = ["std", "CFRunLoop", "CFDate"] }
rmcp = { version = "3.10", default-features = false, features = ["server", "macros", "local"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
httparse = "1"
block2 = "0.6"
hyper = { version = "1", features = ["http1", "server"] }
http-body = "1"
http-body-util = "0.1"
bytes = "1"
[workspace]
